<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Бюджет</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F6F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F6F4F1; --surface: #FFFFFF; --sunk: #F1EFEB; --ink: #15171C; --ink-2: #6B6F78; --line: #ECEAE6;
    --moss: #2F55E4; --moss-ink: #FFFFFF; --moss-soft: #E8EDFD;
    --ok: #2F55E4; --warn: #E8A322; --warn-soft: #FBF0DA; --bad: #EE5D4B; --bad-soft: #FCE6E2;
    --track: #E9ECF3; --shadow: 0 1px 2px rgba(20,24,40,.04), 0 10px 28px rgba(20,24,40,.06);
    --hero: linear-gradient(135deg, #F4F6FF 0%, #E9EEFF 55%, #C9D5FF 120%); --hero-line: rgba(255,255,255,.9);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #111216; --surface: #1B1D23; --sunk: #23262D; --ink: #EEF0F4; --ink-2: #9599A3; --line: #2A2D35;
      --moss: #5B7BFF; --moss-ink: #FFFFFF; --moss-soft: #242C47;
      --ok: #6F8BFF; --warn: #F2B847; --warn-soft: #3A3020; --bad: #FF7A66; --bad-soft: #3B2520;
      --track: #2A2D35; --shadow: none;
      --hero: linear-gradient(135deg, #1B1F2E 0%, #1E2540 60%, #2B3A78 130%); --hero-line: rgba(255,255,255,.06);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.4 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
  body { padding: 8px 14px 120px; max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input { font: inherit; color: var(--ink); }
  :focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
  .muted { color: var(--ink-2); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* месяц */
  .top { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 6px 0 12px; }
  .month { font-size: 16px; font-weight: 600; text-transform: capitalize; padding: 8px 14px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow); }
  .arrow { width: 38px; height: 38px; border-radius: 50%; font-size: 20px; line-height: 38px; color: var(--ink-2); }
  .arrow:active { background: var(--surface); }

  /* главный блок: «бак» месяца */
  .hero-card { background: var(--moss); color: var(--moss-ink); border-radius: 24px; padding: 18px 18px 16px; margin-bottom: 18px; }
  .hc-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; opacity: .85; }
  .hc-big { font-size: 40px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; margin: 6px 0 2px; }
  .hc-big.bad { color: #FFD4C9; }
  .hc-per { font-size: 15px; opacity: .9; }
  .tank { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: rgba(255,255,255,.16); margin: 16px 0 10px; }
  .tank i { display: block; height: 100%; }
  .t-spent { background: #F2F6F1; }
  .t-res { background: repeating-linear-gradient(-45deg, rgba(242,246,241,.75) 0 3px, rgba(242,246,241,.25) 3px 7px); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; opacity: .92; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .d-spent { background: #F2F6F1; } .d-res { background: repeating-linear-gradient(-45deg, rgba(242,246,241,.85) 0 2px, rgba(242,246,241,.3) 2px 4px); } .d-free { background: rgba(255,255,255,.22); }

  /* v7: шапка, кольцо, плитки категорий */
  .mhead { display: flex; align-items: center; gap: 4px; margin: 10px 2px 14px; }
  .mhead .mt { font-size: 24px; font-weight: 700; letter-spacing: -.4px; text-transform: capitalize; }
  .mhead .who { margin-left: auto; color: var(--ink-2); font-weight: 500; }
  .mhead .arrow { width: 32px; height: 32px; line-height: 32px; font-size: 22px; }
  .hero2 { background: var(--hero); border: 1px solid var(--hero-line); border-radius: 26px; padding: 20px 20px 18px; box-shadow: var(--shadow); margin-bottom: 8px; }
  .h2-l { font-size: 15px; color: var(--ink-2); }
  .h2-big { font-size: 46px; font-weight: 800; letter-spacing: -1.6px; line-height: 1.08; color: var(--moss); margin: 6px 0 4px; }
  .h2-big.bad { color: var(--bad); }
  .h2-per { font-size: 15px; color: var(--ink-2); }
  .h2-row { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  .ring { flex: none; width: 124px; height: 124px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .h2-kv { flex: 1; display: grid; gap: 12px; font-size: 15px; }
  .h2-kv div { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); }
  .h2-kv b { color: var(--ink); font-weight: 700; }
  .reslink { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); width: 100%; text-align: left; padding: 0; }
  .reslink span { text-decoration: underline dotted; text-underline-offset: 4px; }
  .h2-kv i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }
  .shead { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 4px 12px; }
  .shead b { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .shead button { color: var(--ink-2); font-size: 15px; }
  .tiles { display: flex; gap: 10px; overflow-x: auto; margin: 0 -14px; padding: 2px 14px 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .tiles::-webkit-scrollbar { display: none; }
  .tile { flex: none; width: 156px; text-align: left; background: var(--surface); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); scroll-snap-align: start; }
  .tile:active { transform: scale(.98); }
  .ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; }
  .ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .tile .tn { margin-top: 12px; font-size: 14.5px; font-weight: 500; line-height: 1.25; min-height: 36px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .tv { font-size: 20px; font-weight: 700; letter-spacing: -.3px; margin-top: 2px; }
  .tile .ts { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbar { height: 6px; border-radius: 4px; background: var(--track); margin-top: 12px; overflow: hidden; }
  .tbar i { display: block; height: 100%; border-radius: 4px; }
  .cat.withico { display: flex; gap: 12px; align-items: center; }
  .sect { font-size: 20px !important; font-weight: 700 !important; letter-spacing: -.3px; margin: 24px 4px 12px !important; }
  .amount::placeholder { font-size: 22px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); opacity: .7; }
  .ob { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--surface); border-radius: 22px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .ob .ci { flex: 1; min-width: 0; }
  .ob .bar { height: 6px; margin: 8px 0 6px; }
  .ob-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .ksplit { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--track); margin: 14px 0 10px; }
  .ksplit i { display: block; height: 100%; }
  .acc2 { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 16px; border-top: 1px solid var(--line); }
  .acc2:first-child { border-top: 0; }
  .acc2 .ci { flex: 1; min-width: 0; }
  .accbox { padding: 4px 16px 14px; border-top: 0; }
  .seg.sm button { padding: 7px 0; font-size: 14px; }
  .chip .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .chip.on .cdot { background: #fff !important; }
  .cat.withico .ci { flex: 1; min-width: 0; }

  /* общие поверхности */
  .card { background: var(--surface); border-radius: 22px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .hero-label { font-size: 14px; color: var(--ink-2); }
  .hero { font-size: 34px; font-weight: 700; letter-spacing: -.6px; margin: 4px 0 6px; }
  .hero.bad { color: var(--bad); }
  .sub { font-size: 14px; color: var(--ink-2); }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin: 10px 0 8px; }
  .bar > i { display: block; height: 100%; border-radius: 3px; }
  .daily { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .sect { font-size: 17px; font-weight: 600; margin: 22px 4px 10px; }

  .cats { background: var(--surface); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 12px; }
  .cat { display: block; width: 100%; text-align: left; padding: 13px 16px; border-top: 1px solid var(--line); }
  .cat:first-child { border-top: 0; }
  .cat:active { background: var(--sunk); }
  .cat-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .cat-name { font-weight: 500; }
  .cat-left { font-weight: 600; }
  .cat .bar { height: 4px; margin: 8px 0 5px; }
  .cat-sub { font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 15px; }
  .kv + .kv { border-top: 1px solid var(--line); }

  /* операции */
  .day { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 18px 6px 8px; }
  .op { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); }
  .op:first-child { border-top: 0; }
  .ava { width: 40px; height: 40px; border-radius: 13px; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 15px; }
  .op-main { flex: 1; min-width: 0; }
  .op-cat { font-weight: 500; }
  .op-meta { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .op-amt { font-weight: 600; }
  .op-amt.inc { color: #22A06B; }
  .op.dup { background: var(--warn-soft); }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; color: var(--warn); margin-left: 6px; }
  .del { color: var(--ink-2); font-size: 13px; padding: 6px 8px; border-radius: 10px; }
  .del.armed { color: #fff; background: var(--bad); }

  .acc { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 13px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
  .acc:first-child { border-top: 0; }
  .acc-edit { display: flex; gap: 8px; padding: 10px 16px 12px; }

  .field { width: 100%; border: 1px solid var(--line); background: var(--sunk); border-radius: 14px; padding: 12px 14px; outline: none; }
  .field:focus { border-color: var(--moss); background: var(--surface); }
  .btn { background: var(--moss); color: var(--moss-ink); border-radius: 16px; padding: 14px 18px; font-weight: 600; width: 100%; }
  .btn:disabled { opacity: .45; }
  .btn.small { width: auto; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
  .ghost { background: var(--moss-soft); color: var(--moss); }

  /* нижняя панель */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: calc(6px + env(safe-area-inset-bottom)) !important; max-width: 560px; margin: 0 auto;
    background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -6px 30px rgba(20,24,40,.08); display: flex; align-items: center; padding: 6px; z-index: 5; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 4px; font-size: 12px; color: var(--ink-2); border-radius: 14px; }
  .tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { color: var(--moss); font-weight: 600; }
  .fab { flex: none; width: 60px; height: 60px; margin: -26px 6px 0; border-radius: 20px; background: var(--moss); color: var(--moss-ink); font-size: 32px; line-height: 60px; box-shadow: 0 10px 22px rgba(47,85,228,.35); }
  .fab:active { transform: scale(.96); }

  /* нижние окна */
  .scrim { position: fixed; inset: 0; background: rgba(10,14,11,.4); z-index: 10; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--ground); border-radius: 26px 26px 0 0; z-index: 11;
    padding: 10px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; transform: translateY(105%); transition: transform .24s cubic-bezier(.2,.8,.2,1); }
  .sheet.open { transform: none; visibility: visible; }
  .sheet:not(.open) { visibility: hidden; transition: transform .24s ease, visibility 0s .24s; }
  .sheet-x { position: absolute; right: 12px; top: 10px; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); color: var(--ink-2); font-size: 14px; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
  .seg { display: flex; background: var(--sunk); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 9px 0; border-radius: 11px; font-weight: 500; color: var(--ink-2); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .amount { font-size: 38px; font-weight: 700; text-align: center; border: 0; background: transparent; width: 100%; outline: none; padding: 6px 0; letter-spacing: -.5px; }
  .amount-hint { text-align: center; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; min-height: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .chip { background: var(--surface); padding: 9px 13px; border-radius: 12px; font-size: 14px; border: 1px solid var(--line); }
  .chip.on { background: var(--moss); color: var(--moss-ink); border-color: var(--moss); }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--ground);
    padding: 12px 14px; border-radius: 14px; font-size: 14px; z-index: 20; opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  .center { text-align: center; padding: 48px 12px; }
  .review { white-space: pre-wrap; font-size: 14.5px; }
  .empty { padding: 18px 16px; color: var(--ink-2); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { .sheet, .toast { transition: none; } }
</style>
</head>
<body>
<div id="view"><div class="center muted">Загрузка…</div></div>

<nav class="tabs" id="tabs" style="display:none">
  <button class="tab on" data-tab="month"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Месяц</button>
  <button class="tab" data-tab="ops"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8"/><circle cx="4" cy="12" r=".8"/><circle cx="4" cy="18" r=".8"/></svg>Операции</button>
  <button class="fab" id="fab" aria-label="Добавить трату или доход">+</button>
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>Квартира</button>
  <button class="tab" data-tab="flat"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>Счета</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
var KEY = '';
var API = '';
var ST = null;
var TAB = 'month';
var BUSY = false;
var FORM = null;
var EDIT_ACC = null;
var REVIEW = '';
var ACC_CHANGE = null;
var EDIT_OB = null;
var PAY_ARM = null;
var DETAIL = null;
var INC_OPEN = false;
var CATV = null;
var ACC_DEL_ARM = false;
var MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WARN = 0.8;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { var v = Math.round(n); var s = Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return (v < 0 ? '−' : '') + s; }
function rub(n) { return fmt(n) + ' ₽'; }
function color(p) { return p > 1.0001 ? 'var(--bad)' : (p >= WARN ? 'var(--warn)' : 'var(--ok)'); }
function bar(p) { return '<div class="bar"><i style="width:' + Math.min(100, Math.max(0, p * 100)).toFixed(1) + '%;background:' + color(p) + '"></i></div>'; }
function monthTitle(mk) { return MONTHS[Number(mk.slice(5, 7)) - 1] + ' ' + mk.slice(0, 4); }
function dayTitle(ds) {
  if (ST && ds === ST.today) return 'Сегодня';
  if (ST && ds === shiftDay(ST.today, -1)) return 'Вчера';
  return Number(ds.slice(8, 10)) + ' ' + MONTHS_GEN[Number(ds.slice(5, 7)) - 1];
}
function shiftDay(ds, n) { var d = new Date(ds + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function shiftMonth(mk, n) { var y = Number(mk.slice(0, 4)), m = Number(mk.slice(5, 7)) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + ('0' + (m + 1)).slice(-2); }
function daysInMonth(mk) { return new Date(Number(mk.slice(0, 4)), Number(mk.slice(5, 7)), 0).getDate(); }

function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, Math.max(2600, String(t).length * 55)); }
function fatal(t) { $('view').innerHTML = '<div class="center"><p>' + esc(t) + '</p></div>'; $('tabs').style.display = 'none'; $('fab').style.display = 'none'; }

function call(fn, args, ok) {
  BUSY = true;
  function fail(m) { BUSY = false; if (!ST) { if (/Ссылка для входа/.test(m)) askLink(m); else fatal(m); } else { toast(m); render(); if (FORM) renderForm(); if (DETAIL) renderDetail(); } }
  fetch(API + '?api=1', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: KEY, fn: fn, args: args }), redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.ok) { BUSY = false; ok(j.res); } else fail((j && j.err) || 'Ошибка сервера.'); })
    .catch(function () { fail('Нет связи с таблицей. Проверьте интернет и попробуйте ещё раз.'); });
}

function load(mk) { call('apiState', [mk || ''], function (s) { ST = s; REVIEW = ''; render(); }); }

// ---------- экраны ----------

function render() {
  if (!ST) return;
  var noMonth = TAB === 'flat' || TAB === 'home';
  $('tabs').style.display = 'flex';
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === TAB); });
  var top = '<div class="top"><button class="arrow" data-act="prev">‹</button><div class="month">' + esc(monthTitle(ST.month)) + '</div>' +
    '<button class="arrow" data-act="next"' + (ST.month >= ST.today.slice(0, 7) ? ' style="visibility:hidden"' : '') + '>›</button></div>';
  var TITLES = { home: 'Квартира', flat: 'Счета' };
  if (TITLES[TAB]) top = '<div class="mhead"><span class="mt">' + TITLES[TAB] + '</span><span class="who">' + esc(ST.me || '') + '</span></div>';

// Оценка эффекта досрочного погашения тем же способом, что и на сервере (аннуитет по ставке).
// Сравниваем «без досрочного» и «с досрочным» одной и той же моделью (аннуитет по ставке),
// поэтому разница корректна, даже если график банка немного расходится со ставкой.
// Минимальная сумма досрочного: по ипотеке — не меньше ежемесячного платежа (условие банка), по кредиту — любая.
function earlyMin(o) { return o.name === 'Ипотека' ? Math.ceil((o.details && o.details.nextPayment) || o.payment || 0) : 0; }
function annuitySim(B, r, pay, cap) { var n = 0, sum = 0; while (B > 0.005 && n < (cap || 600)) { var i = B * r, p = Math.min(pay, B + i); B = B + i - p; sum += p; n++; } return { n: n, sum: sum }; }
function earlyCalc(o, amt, mode) {
  var d = o.details || {}, r = o.rate / 1200, n0 = d.paymentsLeft || 0, P = d.nextPayment || o.payment, B0 = o.balance;
  if (!(amt > 0) || amt > B0 || !(r > 0) || !(n0 > 0) || !(P > 0) || B0 * r >= P) return null;
  var B1 = B0 - amt, oldLast = d.lastDate ? d.lastDate.slice(0, 7) : '';
  if (mode === 'платёж') {
    var k = r / (1 - Math.pow(1 + r, -n0)), cut = amt * k, pay = Math.max(0, P - cut);
    return { n: n0, n0: n0, P: P, pay: pay, saved: Math.max(0, n0 * cut - amt), last: oldLast, oldLast: oldLast };
  }
  var s0 = annuitySim(B0, r, P), s1 = annuitySim(B1, r, P), less = Math.max(0, s0.n - s1.n);
  return { n: n0 - less, n0: n0, P: P, pay: P, saved: Math.max(0, (s0.sum - B0) - (s1.sum - B1)),
    last: oldLast ? shiftMonth(oldLast, -less) : '', oldLast: oldLast };
}
function earlyPreview(o, amt, mode) {
  var c = earlyCalc(o, amt, mode);
  if (!c) return '';
  if (mode === 'платёж') return 'Платёж станет ≈ ' + rub(c.pay) + ' вместо ' + rub(c.P) + ' (−' + rub(c.P - c.pay) + ' в месяц). Экономия на процентах ≈ ' + rub(c.saved) + '.';
  return 'Срок: ' + c.n + ' ' + plural(c.n, 'платёж', 'платежа', 'платежей') + ' вместо ' + c.n0 + (c.last ? ', последний — ' + monthName(c.last) : '') + '. Экономия на процентах ≈ ' + rub(c.saved) + '.';
}
function yearsMonths(k) { var y = Math.floor(k / 12), m = k % 12; return (y ? y + ' ' + plural(y, 'год', 'года', 'лет') : '') + (y && m ? ' ' : '') + (m ? m + ' ' + plural(m, 'месяц', 'месяца', 'месяцев') : '') || '0 месяцев'; }
function calcResults(o, amt) {

  var a = earlyCalc(o, amt, 'срок'), b = earlyCalc(o, amt, 'платёж');
  if (!a || !b) return '<div class="sub" style="text-align:center">Не хватает данных: проверьте ставку и платёж в листе «Квартира».</div>';
  var best = a.saved >= b.saved ? 'срок' : 'платёж';
  function card(title, mode, c, lines) {

      (a.last ? '<div class="sub" style="font-size:12.5px;margin-top:6px">Последний платёж</div><div class="num" style="font-weight:600">' + monthName(a.last) + '</div>' : '')) +

      '<div class="sub" style="font-size:12.5px;margin-top:6px">Меньше в месяц на</div><div class="num" style="font-weight:600">' + rub(b.P - b.pay) + '</div>' +
      (b.last ? '<div class="sub" style="font-size:12.5px;margin-top:6px">Последний платёж</div><div class="num" style="font-weight:600">' + monthName(b.last) + '</div>' : '')) +

      '<div class="card" id="eprev" style="margin:4px 0 10px;font-size:14.5px' + (earlyPreview(o, parseAmt(DETAIL.amount), DETAIL.mode) ? '' : ';display:none') + '">' + esc(earlyPreview(o, parseAmt(DETAIL.amount), DETAIL.mode)) + '</div>' +
      '<div class="amount-hint">Запишется отдельно от бюджета месяца. Остаток и график пересчитаются сразу; точный график потом пришлите боту из банка.</div>' +

      '<button class="btn small ghost" data-act="obedit" data-row="' + o.row + '">Уточнить остаток</button></div>';
  }
  $('sheet').innerHTML = h;
}

function groupOps(ops, fallback, sortMode) {
  var g = {};
  ops.forEach(function (o) {
    var name = String(o.comment || '').trim() || fallback;
    var key = name.toLowerCase().replace(/ё/g, 'е');
    if (!g[key]) g[key] = { name: name.charAt(0).toUpperCase() + name.slice(1), sum: 0, ops: [] };
    g[key].sum += o.amount; g[key].ops.push(o);
  });
  var arr = Object.keys(g).map(function (k) { return g[k]; });
  arr.forEach(function (x) { x.ops.sort(function (a, b) { return a.date < b.date ? 1 : -1; }); });
  if (sortMode === 'alpha') arr.sort(function (a, b) { return a.name.localeCompare(b.name, 'ru'); });
  else arr.sort(function (a, b) { return b.sum - a.sum; });
  return arr;
}

function openCat(title, ops, sortMode, fallback, canAdd, subtitle) {
  FORM = null; DETAIL = null;
  CATV = { title: title, ops: ops, sort: sortMode, fallback: fallback, canAdd: canAdd, subtitle: subtitle || '', open: {} };
  renderCat();
  $('scrim').style.display = 'block';
  requestAnimationFrame(function () { $('sheet').classList.add('open'); });
}

function catLimitBar(name, total) {
  var p = ST.plan.filter(function (x) { return x.name === name; })[0];
  if (!p || !(p.limit > 0) || p.type === ST.typeObl) return '';
  var over = total > p.limit;
  return '<div class="tbar" style="margin:4px 0 6px"><i style="width:' + Math.min(100, total / p.limit * 100).toFixed(1) + '%;background:' + (over ? 'var(--bad)' : catColor(name)) + '"></i></div>' +
    '<div class="cat-sub num" style="margin-bottom:6px"><span>' + (over ? 'перерасход ' + rub(total - p.limit) : 'осталось ' + rub(p.limit - total)) + '</span><span>лимит ' + rub(p.limit) + '</span></div>';
}

function renderCat() {
  var c = CATV;
  var total = c.ops.reduce(function (a, o) { return a + o.amount; }, 0);
  var groups = groupOps(c.ops, c.fallback, c.sort);
  var h = '<button class="sheet-x" data-act="sclose" aria-label="Закрыть">✕</button><div class="grab"></div>' +
    '<div style="display:flex;gap:12px;align-items:center;margin-bottom:4px">' + icoHtml(c.title === 'Траты на квартиру' ? ST.homeCat : c.title) + '<div class="hero-label" style="font-size:16px;color:var(--ink);font-weight:600">' + esc(c.title) + '</div></div>' +
    '<div class="hero num" style="font-size:30px">' + rub(total) + '</div>' + catLimitBar(c.title, total) +
    '<div class="sub" style="margin-bottom:10px">' + esc(c.subtitle) + (c.subtitle ? ', ' : '') + c.ops.length + ' операц., ' + (c.sort === 'alpha' ? 'по алфавиту' : 'от большей суммы') + '</div>';
  if (!groups.length) h += '<div class="card empty">Операций нет.</div>';
  else {
    h += '<div class="cats" style="margin-bottom:12px">';
    groups.forEach(function (g, i) {
      var open = !!c.open[i];
      h += '<button class="cat" data-act="grptoggle" data-i="' + i + '"><div class="cat-row"><span class="cat-name">' + esc(g.name) + ' <span class="muted" style="font-weight:400">' + (open ? '▾' : '▸') + '</span></span>' +
        '<span class="cat-left num">' + rub(g.sum) + '</span></div><div class="cat-sub"><span>' + g.ops.length + ' операц.</span></div></button>';
      if (open) {
        h += '<div style="background:var(--chip);padding:4px 16px 8px">' + g.ops.map(function (o) {
          return '<div class="kv" style="font-size:14px"><span>' + esc(shortDate(o.date) + (o.date.slice(0, 4) !== ST.today.slice(0, 4) ? '.' + o.date.slice(2, 4) : '')) + '<span class="muted">' + (o.who ? ', ' + esc(o.who) : '') + '</span></span><span class="num">' + rub(o.amount) + '</span></div>';
        }).join('') + '</div>';
      }
    });
    h += '</div>';
  }
  if (c.canAdd) h += '<button class="btn" data-act="catadd">Добавить трату в «' + esc(c.title === 'Траты на квартиру' ? ST.homeCat : c.title) + '»</button>';
  $('sheet').innerHTML = h;
}

function openReserved() {
  FORM = null; DETAIL = null; CATV = null;
  var list = ST.plan.filter(function (c) { return c.type === 'Постоянные' && c.fact === 0 && c.limit > 0; })
    .sort(function (a, b) { return b.limit - a.limit; });

function closeForm() { $('sheet').classList.remove('open'); $('scrim').style.display = 'none'; FORM = null; DETAIL = null; CATV = null; }

function parseAmt(s) {
  var t = String(s).replace(/\s| /g, '').replace(',', '.').toLowerCase();
  var k = /к$|k$/.test(t); t = t.replace(/[кk]$/, '');
  var v = Number(t); if (!isFinite(v)) return 0; return k ? v * 1000 : v;
}

function catHint() {
  if (!FORM || FORM.type !== 'расход' || !FORM.cat) return '';
  var c = ST.plan.filter(function (x) { return x.name === FORM.cat; })[0];
  if (!c || !c.limit) return '';
  var after = c.limit - c.fact - parseAmt(FORM.amount);
  return after < 0 ? 'После записи перерасход: ' + rub(-after) : 'После записи останется ' + rub(after);
}

function syncSave() {
  var b = $('fsave'); if (!b || !FORM) return;
  b.disabled = BUSY || !(parseAmt(FORM.amount) > 0) || (FORM.type === 'расход' && !FORM.cat);
}

function saveForm() {
  var f = FORM, amt = parseAmt(f.amount);
  if (!(amt > 0) || BUSY) return;
  var payload = { type: f.type, amount: amt, cat: f.cat, date: f.date, comment: f.comment };
  renderForm();
  BUSY = true; syncSave(); $('fsave').textContent = 'Сохраняю…';
  call('apiAdd', [payload], function (s) {
    ST = s; REVIEW = '';
    closeForm(); render();
    if (s.dupWarning) { toast(s.dupWarning); return; }
    if (payload.type === 'доход') { toast('Записан доход ' + rub(amt)); return; }
    var c = s.plan.filter(function (x) { return x.name === payload.cat; })[0];
    if (c && c.limit) {
      var l = c.limit - c.fact, p = c.fact / c.limit, before = (c.fact - amt) / c.limit;
      var t = rub(amt) + ', ' + c.name + '. ' + (l < 0 ? 'Перерасход ' + rub(-l) : 'Осталось ' + rub(l));
      if (before < 1 && p >= 1) t += '. Лимит превышен.'; else if (before < WARN && p >= WARN) t += '. Использовано больше 80%.';
      toast(t);
    } else toast('Записано: ' + rub(amt) + ', ' + payload.cat);
  });
}

function askLink(msg) {
  $('tabs').style.display = 'none'; $('fab').style.display = 'none';
  $('view').innerHTML = '<div class="center"><p>' + esc(msg || 'Вставьте личную ссылку для входа в бюджет.') + '</p>' +
    '<input id="linkIn" class="field" style="width:100%;margin:12px 0" placeholder="https://…#k=…" autocomplete="off">' +
    '<button class="btn" id="linkGo">Войти</button></div>';
  $('linkGo').onclick = function () {
    var o = parseLink($('linkIn').value);
    if (!o) return toast('Это не похоже на ссылку для входа.');
    store('budgetKey', o.k); store('budgetApi', o.api); boot();
  };
}
function boot() {
  var o = parseLink(location.hash);
  if (o) { store('budgetKey', o.k); store('budgetApi', o.api); }
  KEY = store('budgetKey'); API = store('budgetApi');
  var p = new URLSearchParams(location.search).get('tab');
  if (p === 'flat' || p === 'home') TAB = p;
  if (!KEY || !API) return askLink();
  $('fab').style.display = '';
  load('');
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && ST && !FORM && !DETAIL && !BUSY) load(ST.month);
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
boot();
</script>
</body>
</html>
